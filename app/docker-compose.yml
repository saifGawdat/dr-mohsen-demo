services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 is taken by the zaki-jewelry stack; this project uses 5434.
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dr_mohsen
    volumes:
      - dr_mohsen_pgdata:/var/lib/postgresql/data

volumes:
  dr_mohsen_pgdata:
